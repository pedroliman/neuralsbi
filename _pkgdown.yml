url: https://neuralsbi.pedrodelima.com/

# `docs/` holds the package's design documents, so the rendered site goes to
# `site/` (gitignored); CI deploys it to the gh-pages branch.
destination: site

template:
  bootstrap: 5
  light-switch: true
  math-rendering: katex
  bslib:
    primary: "#2c5f7c"
    base_font: {google: "Source Serif 4"}
    heading_font: {google: "Source Serif 4"}
    code_font: {google: "JetBrains Mono"}
  # Social-share card and Twitter/X preview: the package's hex logo. pkgdown
  # turns the relative image path into an absolute og:image against `url`.
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "neuralsbi hex logo: a neural network feeding a posterior density"
    twitter:
      creator: "@PedroNdeLima"
      card: summary_large_image
  includes:
    in_header: |
       <!-- Global site tag (gtag.js) - Google Analytics -->
       <script async src="https://www.googletagmanager.com/gtag/js?id=G-49QZC8ZP1X" ></script>
       <script>
         window.dataLayer = window.dataLayer || [];
         function gtag(){dataLayer.push(arguments);}
         gtag('js', new Date());

         gtag('config', 'G-49QZC8ZP1X');
       </script>
       <!-- Google tag (gtag.js) -->
       <!-- Structured data: describe the package to search engines so it can
            surface as a software result rather than a generic web page. -->
       <script type="application/ld+json">
       {
         "@context": "https://schema.org",
         "@type": "SoftwareSourceCode",
         "name": "neuralsbi",
         "description": "A native R implementation of neural simulation-based inference (SBI). Trains neural posterior estimators on a prior and simulator for amortized, likelihood-free Bayesian inference, running on the torch back end.",
         "url": "https://neuralsbi.pedrodelima.com/",
         "codeRepository": "https://github.com/pedroliman/neuralsbi",
         "programmingLanguage": {
           "@type": "ComputerLanguage",
           "name": "R"
         },
         "runtimePlatform": "R",
         "applicationCategory": "Statistical software",
         "license": "https://opensource.org/licenses/MIT",
         "keywords": [
           "neural simulation-based inference",
           "simulation-based inference",
           "amortized Bayesian inference",
           "likelihood-free inference",
           "neural posterior estimation",
           "approximate Bayesian computation",
           "R package",
           "torch"
         ],
         "author": {
           "@type": "Person",
           "name": "Pedro Nascimento de Lima",
           "url": "https://pedrodelima.com/",
           "identifier": "https://orcid.org/0000-0001-9057-198X"
         }
       }
       </script>

home:
  title: Neural simulation-based inference in R
  description: >
    Amortized, likelihood-free Bayesian inference in R. neuralsbi trains neural
    posterior estimators (MDN, MAF, NSF) from a prior and a simulator to
    approximate the Bayesian posterior, with built-in calibration diagnostics.
    No likelihood and no Python required.

authors:
  Pedro Nascimento de Lima:
    href: https://pedrodelima.com/
  footer:
    roles: [cre]
    text: "Developed by"

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: Introduction to neural simulation-based inference in R
        href: articles/intro-to-sbi.html
      - text: "Neural likelihood estimation, and handing it to Stan"
        href: articles/neural-likelihood.html

articles:
- title: Learning the package
  navbar: ~
  contents:
  - articles/intro-to-sbi
# Every article pkgdown builds has to appear somewhere in this index or the
# build aborts. The `internal` title is how pkgdown says "build it, do not list
# it": these six are still rendered and still reachable by URL, they are just
# off the articles index and out of the navbar. Everything under
# `vignettes/articles/` carries that prefix in its name here; `neuralsbi` does
# not, because it is the one article that ships as a package vignette.
- title: internal
  contents:
  - articles/neural-likelihood
  - neuralsbi
  - articles/density-estimators
  - articles/diagnostics
  - articles/sir-epidemic
  - articles/sir-time-varying-beta

reference:
- title: Priors
  desc: Define the prior distribution over simulator parameters.
  contents:
  - priors
  - prior_uniform
  - prior_normal
  - prior_custom
  - sample_prior
  - within_support
- title: Simulation and training
  desc: Generate training data and fit a neural posterior estimator.
  contents:
  - simulate_for_sbi
  - npe
  - npe_sequential
  - nle
  - nre
  - save_npe
  - density_estimator
  - embedding_mlp
- title: Neural likelihood estimation
  desc: Learn a surrogate likelihood, sample it with MCMC, and export it to Stan.
  contents:
  - log_lik
  - likelihood_fn
  - posterior.nsbi_nle
  - sample.nsbi_mcmc_posterior
  - nsbi_mcmc
  - stan_export
- title: Neural ratio estimation
  desc: Learn the likelihood-to-evidence ratio with a classifier and sample it with MCMC.
  contents:
  - log_ratio
  - posterior.nsbi_nre
- title: Running the simulator
  desc: The simulator contract, parallel execution, and progress reporting.
  contents:
  - nsbi_simulator
  - nsbi_parallel
  - nsbi_progress
- title: Working with the posterior
  desc: Condition on data, then sample, evaluate, and summarize.
  contents:
  - posterior
  - sample
  - sample.nsbi_posterior
  - sample_posterior
  - log_prob
  - map_estimate
  - summaries
- title: Diagnostics
  desc: Calibration and predictive checks for a fitted posterior.
  contents:
  - diagnostics
  - sbc
  - expected_coverage
  - tarp
  - c2st
  - posterior_predictive
- title: Plotting
  contents:
  - pairplot
  - plot_sbc
  - plot_coverage
  - plot_tarp
  - plot_posterior_predictive
- title: Benchmark tasks
  desc: Reference inference problems shared by the tests and benchmarks.
  contents:
  - tasks
