# Measures test coverage with covr and uploads the report to Codecov.
#
# The job installs libtorch and the graphics Suggests on purpose. Both the
# neural estimators and the plotting functions skip themselves when their
# back end is missing, so a coverage run without them reports skipped code as
# untested and the number stops meaning anything. libtorch comes from the same
# cache key the test-torch job in R-CMD-check.yaml populates, so the two jobs
# share one download.
#
# Uploading needs a CODECOV_TOKEN repository secret and the repo linked to a
# Codecov account. Until both exist the upload step fails; on pull requests it
# is set not to fail the job.
name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TORCH_HOME: /home/runner/.cache/torch
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # cmdstanr is a Suggests and is not on CRAN, so the dependency solver
          # cannot resolve it without the Stan repository.
          extra-repositories: https://mc-stan.org/r-packages/

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # torch and the graphics packages are named explicitly so a resolver
          # that treats Suggests as optional still installs them.
          extra-packages: >-
            any::covr,
            any::xml2,
            any::torch,
            any::ggplot2,
            any::GGally,
            any::ggdensity
          needs: coverage

      - name: Cache libtorch
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/torch
          key: libtorch-${{ runner.os }}-r-torch

      - name: Install libtorch
        # torch 0.17 refuses a TORCH_HOME that does not exist yet, so create it
        # before asking for the install.
        run: |
          mkdir -p "$TORCH_HOME"
          Rscript -e 'if (!torch::torch_is_installed()) torch::install_torch()'

      - name: Measure coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          # Needs a CODECOV_TOKEN secret; without it the upload cannot
          # authenticate.
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
