# Decides whether the current DESCRIPTION Version warrants a CRAN
# submission, and if so, tags it, publishes a prerelease GitHub Release, and
# dispatches cran-submission.yaml directly (the release alone will not
# trigger it -- see the comment on that step). This workflow never talks to
# CRAN itself.
#
# Policy (issue #110): submit on every minor or major version bump; a
# patch-only bump also submits once at least three weeks have passed since
# the last release tag, so fixes do not sit unsubmitted indefinitely; a
# patch bump inside that window does not submit on its own.
name: release-check

on:
  push:
    branches: [main]
    paths: [DESCRIPTION]
  schedule:
    # Monday 12:00 UTC. Catches the three-week fallback even on a week with
    # no push to DESCRIPTION.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find the last release tag
        id: last_tag
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "tag=$last_tag" >> "$GITHUB_OUTPUT"
          # Epoch seconds (%ct), not ISO 8601 (%cI). git writes the offset as
          # -04:00, and glibc's strptime %z rejects the colon, so the R side
          # used to parse the timestamp to NA and die on the comparison.
          if [ -n "$last_tag" ]; then
            echo "epoch=$(git log -1 --format=%ct "$last_tag")" >> "$GITHUB_OUTPUT"
          else
            echo "epoch=" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Decide whether to release
        id: decide
        env:
          LAST_TAG: ${{ steps.last_tag.outputs.tag }}
          LAST_TAG_EPOCH: ${{ steps.last_tag.outputs.epoch }}
        run: |
          Rscript - <<'EOF' >> "$GITHUB_OUTPUT"
          desc <- read.dcf("DESCRIPTION")
          current <- desc[1, "Version"]
          current_v <- unclass(package_version(current))[[1]]

          last_tag <- Sys.getenv("LAST_TAG")
          last_tag_epoch <- suppressWarnings(as.numeric(Sys.getenv("LAST_TAG_EPOCH")))

          should_release <- FALSE
          reason <- ""

          if (!nzchar(last_tag)) {
            should_release <- TRUE
            reason <- "no prior release tag; establishing the baseline"
          } else {
            last_v <- unclass(package_version(sub("^v", "", last_tag)))[[1]]
            if (identical(current_v, last_v)) {
              reason <- sprintf("DESCRIPTION Version %s matches the last release tag %s; nothing to submit", current, last_tag)
            } else if (current_v[1] != last_v[1] || current_v[2] != last_v[2]) {
              should_release <- TRUE
              reason <- sprintf("minor or major version bump (%s -> %s)", sub("^v", "", last_tag), current)
            } else {
              weeks_since <- as.numeric(difftime(Sys.time(), as.POSIXct(last_tag_epoch, origin = "1970-01-01", tz = "UTC"), units = "weeks"))
              if (!is.finite(weeks_since)) {
                # Never let an unreadable tag date halt the job: report it and
                # hold the submission rather than guessing either way.
                reason <- sprintf("patch bump %s -> %s, but the last release tag's date could not be read; not submitting", sub("^v", "", last_tag), current)
              } else if (weeks_since >= 3) {
                should_release <- TRUE
                reason <- sprintf("patch bump %s -> %s, %.1f weeks since the last release", sub("^v", "", last_tag), current, weeks_since)
              } else {
                reason <- sprintf("patch bump %s -> %s, only %.1f weeks since the last release (needs 3)", sub("^v", "", last_tag), current, weeks_since)
              }
            }
          }

          cat("should_release=", tolower(should_release), "\n", sep = "")
          cat("version=", current, "\n", sep = "")
          cat("reason=", reason, "\n", sep = "")
          EOF

      - name: Log decision
        run: echo "should_release=${{ steps.decide.outputs.should_release }} reason=${{ steps.decide.outputs.reason }}"

  release:
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
          REASON: ${{ needs.decide.outputs.reason }}
        run: |
          tag="v${VERSION}"
          notes_file=$(mktemp)
          awk '/^# neuralsbi /{if (seen) exit; seen=1; next} seen' NEWS.md > "$notes_file"
          {
            echo "Triggered because: ${REASON}."
            echo
            cat "$notes_file"
          } > "$notes_file.final"

          git tag "$tag"
          git push origin "$tag"

          gh release create "$tag" \
            --title "neuralsbi ${VERSION}" \
            --notes-file "$notes_file.final" \
            --prerelease

      - name: Trigger the CRAN submission workflow
        # A release created with secrets.GITHUB_TOKEN does not itself fire
        # cran-submission.yaml's `release: types: [prereleased]` trigger --
        # GitHub does not chain workflow runs from GITHUB_TOKEN-generated
        # events, to prevent accidental recursion. workflow_dispatch is
        # explicitly exempt from that restriction, so dispatch it directly
        # rather than relying on the release event to cascade.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cran-submission.yaml --ref main -f confirmation=CONFIRM
