# Runs R CMD check and the torch-free test suite on every push / PR.
# The neural (torch) tests skip themselves when libtorch is absent, so the
# check job stays fast; the test-torch job installs libtorch (cached between
# runs) and exercises the full neural suite (MDN, MAF).
#
# Vignettes are precomputed: vignettes/*.Rmd is baked static Markdown (built
# from *.Rmd.orig by vignettes/precompute.R), so the vignette rebuild during
# R CMD check runs no torch code and stays fast.
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # cmdstanr is a Suggests and is not on CRAN, so the dependency solver
          # cannot resolve it without the Stan repository.
          extra-repositories: https://mc-stan.org/r-packages/

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  test-torch:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TORCH_HOME: /home/runner/.cache/torch
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://mc-stan.org/r-packages/

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # xml2 backs testthat's JunitReporter, which writes the file Codecov
          # test analytics reads.
          extra-packages: any::testthat, any::torch, any::xml2

      - name: Cache libtorch
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/torch
          key: libtorch-${{ runner.os }}-r-torch

      - name: Install libtorch
        # torch 0.17 refuses a TORCH_HOME that does not exist yet, so create it
        # before asking for the install.
        run: |
          mkdir -p "$TORCH_HOME"
          Rscript -e 'if (!torch::torch_is_installed()) torch::install_torch()'

      - name: Install package and run full test suite
        # NEURALSBI_JUNIT makes tests/testthat.R add a JunitReporter alongside
        # the check reporter. This is the fullest run in CI, with libtorch
        # present, so it is the one worth reporting on.
        env:
          NEURALSBI_JUNIT: ${{ github.workspace }}/junit.xml
        run: |
          R CMD INSTALL --no-docs .
          cd tests && Rscript testthat.R

      - name: Upload test results to Codecov
        # Runs on failure too. A red suite is exactly when the per-test view is
        # worth having, and the reporter writes the file either way.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
