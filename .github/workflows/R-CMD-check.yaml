# Runs R CMD check and the torch-free test suite on every push / PR.
# The neural (torch) tests skip themselves when libtorch is absent, so this
# job stays fast. The full neural suite (MDN, MAF, NSF) runs with libtorch
# installed inside the test-coverage job (test-coverage.yaml) instead of a
# separate job here: covr's package_coverage() already has to install the
# package and run every test to instrument it, so a second libtorch install
# and full test run in this workflow would just repeat that work.
#
# Vignettes are precomputed: vignettes/*.Rmd is baked static Markdown (built
# from *.Rmd.orig by vignettes/precompute.R), so the vignette rebuild during
# R CMD check runs no torch code and stays fast.
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # cmdstanr is a Suggests and is not on CRAN, so the dependency solver
          # cannot resolve it without the Stan repository.
          extra-repositories: https://mc-stan.org/r-packages/

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
